<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Fluency Lab</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>AI Fluency Lab</h1>

      <p>Anthropic AI Fluency: Framework & Foundations</p>

      <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </header>

    <nav>
      <button onclick="showSection('modules')">Modules</button>

      <button onclick="showSection('prompts')">Prompt Library</button>

      <button onclick="showSection('quiz')">Quiz</button>
    </nav>

    <section id="modules">
      <h2>AI Fluency Modules</h2>

      <div id="moduleContainer"></div>
    </section>

    <section id="framework">
      <h2>The 4D Framework</h2>

      <div id="frameworkContainer"></div>
    </section>

    <section id="prompts">
      <h2>Prompt Library</h2>

      <input
        type="text"
        id="searchInput"
        placeholder="Search prompts..."
        onkeyup="searchPrompts()"
      />

      <div id="promptContainer"></div>
    </section>

    <section id="quiz">
      <h2>AI Fluency Quiz</h2>

      <div id="quizContainer"></div>

      <button onclick="nextQuestion()">Next Question</button>

      <p id="score"></p>
    </section>

    <section>
      <h2>Learning Progress</h2>

      <button onclick="completeLearning()">Mark Completed</button>

      <p id="progress"></p>
    </section>

    <footer>
      <p>AI Fluency Lab Version 1.0</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
